<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142720" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Chinese study app with FSRS-6 flashcards, neural Mandarin audio, grammar, readings, and progressive HSK tests. Local-first, no account or backend." />
    <title>HanPit</title>
  </head>
  <body>
    <div class="page-garden" aria-hidden="true">
      <svg class="garden-sprig" viewBox="0 0 180 650" fill="none" focusable="false">
        <defs>
          <g id="garden-sprig">
            <path class="garden-stems" d="M90 650C38 480 130 275 82 40M84 500L35 432M84 420L135 342M95 330L45 260M92 240L135 170M88 145L52 90" />
            <g class="garden-leaves">
              <path d="M84 500Q10 490 20 420Q76 428 84 500ZM84 500Q148 480 153 425Q106 434 84 500Z" />
              <path d="M84 420Q16 402 22 345Q67 350 84 420ZM84 420Q153 402 143 330Q96 349 84 420Z" />
              <path d="M95 330Q25 319 30 247Q78 259 95 330ZM95 330Q153 306 151 255Q111 259 95 330Z" />
              <path d="M92 240Q37 223 40 170Q84 180 92 240ZM92 240Q150 217 143 157Q102 171 92 240Z" />
              <path d="M88 145Q35 124 42 77Q82 88 88 145ZM88 145Q137 121 125 73Q94 83 88 145Z" />
            </g>
            <g class="garden-stars">
              <path d="M82 19L85 31L97 34L85 37L82 49L79 37L67 34L79 31Z" />
              <circle cx="34" cy="300" r="2" /><circle cx="147" cy="466" r="2.5" /><circle cx="135" cy="122" r="1.5" />
            </g>
          </g>
        </defs>
        <use href="#garden-sprig" />
      </svg>
      <svg class="garden-sprig garden-sprig-right" viewBox="0 0 180 650" fill="none" focusable="false"><use href="#garden-sprig" /></svg>
      <svg class="garden-orbits" viewBox="0 0 400 320" fill="none" focusable="false">
        <g stroke="currentColor" stroke-width=".8" opacity=".2" transform="rotate(-28 200 160)">
          <ellipse cx="200" cy="160" rx="184" ry="78" /><ellipse cx="200" cy="160" rx="145" ry="112" />
          <ellipse cx="200" cy="160" rx="104" ry="104" stroke-dasharray="2 8" />
        </g>
        <g class="garden-stars"><circle cx="64" cy="166" r="3" /><circle cx="293" cy="73" r="5" /><path d="M168 51V65M161 58H175" stroke="currentColor" /></g>
      </svg>
    </div>
    <header class="header">
      <a class="brand" href="./" aria-label="HanPit, home"><span lang="zh-CN">汉</span> HanPit</a>
      <span class="standard">HSK 3.0</span>
    </header>
    <main>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-section="flashcards" aria-current="page">Flashcards</button>
        <button type="button" data-section="grammar">Grammar</button>
        <button type="button" data-section="readings">Readings</button>
        <button type="button" data-section="tests">Tests</button>
      </nav>
      <p id="error" role="alert" hidden></p>
      <div id="section-heading" class="deck-heading">
        <h1 id="section-title">Flashcards</h1>
        <label class="level-label" for="level">Level
          <select id="level" disabled>
            <option value="1">HSK 1</option>
            <option value="2">HSK 2</option>
            <option value="3">HSK 3</option>
            <option value="4">HSK 4</option>
            <option value="5">HSK 5</option>
            <option value="6">HSK 6</option>
            <option value="7">HSK 7–9</option>
          </select>
        </label>
      </div>
      <section id="flashcards" aria-label="Flashcards" aria-busy="true">
        <dl class="counts" aria-label="Deck status">
          <div><dt>New</dt><dd id="new-count">—</dd></div>
          <div><dt>Due</dt><dd id="due-count">—</dd></div>
          <div><dt>Studied</dt><dd id="studied-count">—</dd></div>
        </dl>
        <article class="card" id="card" aria-label="Study card" hidden>
          <span class="card-level" id="card-level"></span>
          <div class="card-content">
            <h2 id="hanzi" lang="zh-CN"></h2>
            <div id="answer" hidden>
              <p id="pinyin" lang="zh-Latn-pinyin"></p>
              <p class="meaning-label">Meaning · EN</p>
              <p id="meaning" lang="en"></p>
              <button id="speak" class="speak" type="button" aria-label="Listen to the pronunciation">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5V4Z" stroke-linejoin="round"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke-linecap="round"/></svg>
                Listen
              </button>
              <p id="speech-status" role="status" hidden></p>
            </div>
          </div>
        </article>
        <p id="empty" class="empty" role="status">Loading…</p>
        <div class="actions">
          <button id="reveal" class="primary" type="button" hidden>Show answer <kbd>Space</kbd></button>
          <div id="ratings" class="ratings" aria-label="How well did you remember?" hidden>
            <button type="button" data-grade="1"><span>Again</span><small></small><kbd>1</kbd></button>
            <button type="button" data-grade="2"><span>Hard</span><small></small><kbd>2</kbd></button>
            <button type="button" data-grade="3"><span>Good</span><small></small><kbd>3</kbd></button>
            <button type="button" data-grade="4"><span>Easy</span><small></small><kbd>4</kbd></button>
          </div>
        </div>
      </section>
      <section id="grammar" aria-label="Grammar" hidden></section>
      <section id="readings" aria-label="Readings" hidden></section>
      <section id="tests" aria-label="Tests" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
